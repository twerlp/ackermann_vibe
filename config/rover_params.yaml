# rover_params.yaml — single source of truth for all node parameters.
# Parameters under "/**" are shared across all nodes.
# Parameters under "/<node_name>" are node-specific.
#
# ==============================================================================
# Shared — every node reads these
# ==============================================================================
/**:
  ros__parameters:
    # Vehicle geometry — must match urdf/rover.urdf.xacro
    wheelbase: 1.2
    track_width: 0.8
    wheel_radius: 0.15
    chassis_length: 1.6
    chassis_width: 0.9
    max_steering_angle: 0.52
    max_forward_speed: 5.0
    max_reverse_speed: 2.0
    max_motor_speed: 6000.0

    # Odometry
    odom_rate: 50.0
    ticks_per_rev: 1024

    # Runtime mode
    simulated: true

# ==============================================================================
# lidar_driver
# ==============================================================================
/lidar_driver:
  ros__parameters:
    serial_port: /dev/lidar
    baud_rate: 230400
    scan_rate: 10.0
    range_min: 0.12
    range_max: 12.0
    angle_min: -3.14159265358979
    angle_max: 3.14159265358979
    num_samples: 360
    lidar_offset_x: 0.65
    lidar_offset_y: 0.0
    frame_id: lidar_link

# ==============================================================================
# vesc_driver
# ==============================================================================
/vesc_driver:
  ros__parameters:
    serial_port: /dev/vesc
    baud_rate: 115200
    vesc_id: 0
    max_duty: 0.95
    max_current: 40.0

# ==============================================================================
# steering_servo
# ==============================================================================
/steering_servo:
  ros__parameters:
    pwm_pin: 12
    pwm_chip: 0
    center_pulse_us: 1500.0
    range_pulse_us: 500.0
    max_angle_rad: 0.52
    min_angle_rad: -0.52

# ==============================================================================
# imu_driver
# ==============================================================================
/imu_driver:
  ros__parameters:
    i2c_device: /dev/i2c-1
    i2c_address: 104
    imu_rate: 100.0
    frame_id: imu_link
